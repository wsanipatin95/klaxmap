<div class="af">
  <div class="af-body">
    <div class="g3">
      <div class="campo">
        <label>Nombre de la ficha</label>
        <input class="inp" [(ngModel)]="modelo.nombre" placeholder="Ej. Antena Cangahua" />
      </div>
      <div class="campo">
        <label>Quién abre</label>
        <input class="inp" [(ngModel)]="modelo.contacto" placeholder="Nombre del contacto" />
      </div>
      <div class="campo">
        <label>Teléfono</label>
        <input class="inp" [(ngModel)]="modelo.telefono" placeholder="09…" />
      </div>
      <div class="campo">
        <label>Tipo de llave</label>
        <input class="inp" [(ngModel)]="modelo.tipoLlave" placeholder="Conserje, guardia 24 h…" />
      </div>
      <div class="campo">
        <label>Avisar antes (horas)</label>
        <input class="inp" type="number" min="0" [(ngModel)]="modelo.avisoHoras" placeholder="0" />
      </div>
      <div class="campo">
        <label>Notas</label>
        <input class="inp" [(ngModel)]="modelo.notas" placeholder="Opcional" />
      </div>
      <div class="campo c3">
        <label>Cómo se llega / dónde se pide la llave</label>
        <input class="inp" [(ngModel)]="modelo.referencia"
               placeholder="Ej. tras la cancha, portón verde. La llave se pide en la tienda de la esquina." />
      </div>
    </div>

    <div class="hor">
      <div class="hor-head">
        <span class="t">Horario de ingreso</span>
        <span class="tenue">{{ (modelo.horarios ?? []).length ? (modelo.horarios ?? []).length + ' tramo(s)' : 'Sin tramos: se puede entrar siempre' }}</span>
        <span class="sp"></span>
        <button type="button" class="chip" (click)="preset([1,2,3,4,5], '08:00', '17:00')">Lun–Vie 8–17</button>
        <button type="button" class="chip" (click)="preset([1,2,3,4,5,6], '08:00', '17:00')">Lun–Sáb 8–17</button>
        <button type="button" class="chip" (click)="preset([1,2,3,4,5,6,7], '08:00', '18:00')">Todos 8–18</button>
        <button type="button" class="chip ghost" (click)="limpiarHorario()" *ngIf="(modelo.horarios ?? []).length">Limpiar</button>
      </div>

      <div class="dias">
        <div class="dia" *ngFor="let d of DIAS" [class.vacio]="!tramosDe(d.n).length">
          <span class="dia-n">{{ d.corto }}</span>
          <div class="dia-tramos">
            <div class="tramo" *ngFor="let h of tramosDe(d.n)">
              <input class="inp hora" type="time" [(ngModel)]="h.desde" />
              <span class="a">–</span>
              <input class="inp hora" type="time" [(ngModel)]="h.hasta" />
              <button type="button" class="ib" (click)="quitarTramo(h)" title="Quitar este tramo">×</button>
            </div>
            <span class="libre" *ngIf="!tramosDe(d.n).length">sin horario</span>
          </div>
          <button type="button" class="ib mas" (click)="agregarTramo(d.n)" title="Agregar un tramo a {{ d.corto }}">+</button>
        </div>
      </div>
    </div>

  </div>

  <div class="af-foot">
    <span class="af-error" *ngIf="error()">{{ error() }}</span>
    <span class="sp"></span>
    <button type="button" class="btn" (click)="cancelado.emit()">Cancelar</button>
    <button type="button" class="btn pri" [disabled]="saving()" (click)="guardar()">
      {{ saving() ? 'Guardando…' : 'Guardar ficha' }}
    </button>
  </div>
</div>
